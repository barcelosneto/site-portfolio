<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Prévia do projeto demonstrativo Linha Viva — Arquitetura &amp; Interiores">
  <defs>
    <linearGradient id="arq-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262626"/>
      <stop offset="50%" stop-color="#404040"/>
      <stop offset="100%" stop-color="#525252"/>
    </linearGradient>
    <linearGradient id="arq-champagne" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#E5C158"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="#141414"/>
  <rect width="800" height="500" fill="url(#arq-bg)" opacity="0.18"/>

  <!-- Browser Window Chrome -->
  <rect x="36" y="28" width="728" height="444" rx="16" fill="#1F1F1F" stroke="#383838" stroke-width="1.5"/>
  <rect x="36" y="28" width="728" height="48" rx="16" fill="#171717"/>
  <line x1="36" y1="76" x2="764" y2="76" stroke="#383838" stroke-width="1"/>
  
  <!-- Window Dots -->
  <circle cx="58" cy="52" r="5" fill="#EF4444"/>
  <circle cx="74" cy="52" r="5" fill="#F59E0B"/>
  <circle cx="90" cy="52" r="5" fill="#10B981"/>
  <text x="110" y="56" fill="#E5E5E5" font-family="monospace" font-size="11">linhaviva.demo/projetos</text>

  <!-- Navbar inside mockup -->
  <rect x="520" y="40" width="220" height="24" rx="6" fill="#2B2B2B"/>
  <text x="630" y="56" fill="#F5F5F5" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Residencial • Comercial • Briefing</text>

  <!-- Hero Content Left -->
  <rect x="68" y="104" width="180" height="24" rx="12" fill="#2E2A1E" stroke="#856F28"/>
  <circle cx="84" cy="116" r="4" fill="#D4AF37"/>
  <text x="160" y="120" fill="#FDF3CE" font-family="monospace" font-size="9.5" font-weight="700" text-anchor="middle">ARQUITETURA &amp; INTERIORES</text>

  <text x="68" y="164" fill="#FAFAFA" font-family="Georgia, serif" font-size="28" font-weight="700">Espaços vivos,</text>
  <text x="68" y="196" fill="#D4AF37" font-family="Georgia, serif" font-size="28" font-weight="700">design atemporal.</text>
  <text x="68" y="226" fill="#A3A3A3" font-family="system-ui, sans-serif" font-size="12">Portfólio com slider de comparação antes/depois,</text>
  <text x="68" y="244" fill="#A3A3A3" font-family="system-ui, sans-serif" font-size="12">memorial de acabamentos e triagem de briefing.</text>

  <rect x="68" y="266" width="140" height="34" rx="8" fill="url(#arq-champagne)"/>
  <text x="138" y="287" fill="#1F1A0C" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">Ver Obras &amp; Projetos</text>

  <!-- Comparison Mockup Right -->
  <rect x="440" y="104" width="290" height="190" rx="12" fill="#262626" stroke="#404040"/>
  <text x="460" y="132" fill="#F5F5F5" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Comparação Visual Antes / Depois</text>
  
  <rect x="460" y="148" width="120" height="130" rx="6" fill="#1A1A1A"/>
  <text x="520" y="215" fill="#737373" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Planta Bruta</text>

  <rect x="590" y="148" width="120" height="130" rx="6" fill="#332B1E" stroke="#856F28" stroke-width="1"/>
  <text x="650" y="215" fill="#D4AF37" font-family="Georgia, serif" font-size="11" font-weight="700" text-anchor="middle">Obra Concluída</text>

  <!-- Feature Strip Bottom -->
  <rect x="68" y="320" width="662" height="126" rx="12" fill="#212121" stroke="#383838"/>
  <rect x="90" y="340" width="190" height="86" rx="8" fill="#171717"/>
  <text x="105" y="365" fill="#D4AF37" font-family="system-ui, sans-serif" font-size="11" font-weight="700">◇ Slider Interativo</text>
  <text x="105" y="388" fill="#A3A3A3" font-family="system-ui, sans-serif" font-size="10">Arraste para comparar reforma</text>

  <rect x="300" y="340" width="190" height="86" rx="8" fill="#171717"/>
  <text x="315" y="365" fill="#D4AF37" font-family="system-ui, sans-serif" font-size="11" font-weight="700">◇ Memorial Descritivo</text>
  <text x="315" y="388" fill="#A3A3A3" font-family="system-ui, sans-serif" font-size="10">Paleta, marcenaria e iluminação</text>

  <rect x="510" y="340" width="200" height="86" rx="8" fill="#171717"/>
  <text x="525" y="365" fill="#D4AF37" font-family="system-ui, sans-serif" font-size="11" font-weight="700">◇ Formulário de Briefing</text>
  <text x="525" y="388" fill="#A3A3A3" font-family="system-ui, sans-serif" font-size="10">Metragem, prazo e perfil de uso</text>
</svg>
