<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Prévia do projeto demonstrativo Horizonte Prime Imobiliária">
  <defs>
    <linearGradient id="imob-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060914"/>
      <stop offset="55%" stop-color="#111633"/>
      <stop offset="100%" stop-color="#0D1E3A"/>
    </linearGradient>
    <linearGradient id="imob-accent" x1="0%" y1="0%" x2="100%" y2="0%">
