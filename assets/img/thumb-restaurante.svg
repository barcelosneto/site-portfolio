  <text x="146" y="119" fill="#FBBF24" font-family="monospace" font-size="9.5" font-weight="700" text-anchor="middle">PARRILLA &amp; FOGO DE CHÃO</text>

  <text x="68" y="164" fill="#FFFBEB" font-family="Georgia, serif" font-size="34" font-weight="700">Cortes nobres &amp;</text>
  <text x="68" y="202" fill="#F59E0B" font-family="Georgia, serif" font-size="34" font-weight="700">cozinha de brasa.</text>
  <text x="68" y="232" fill="#A8A29E" font-family="system-ui, sans-serif" font-size="13">Cardápio digital filtrável por categoria, restrições</text>
