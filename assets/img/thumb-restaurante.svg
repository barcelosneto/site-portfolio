  <rect x="514" y="380" width="200" height="54" rx="8" fill="#140D0A" stroke="#2E1D16"/>
  <text x="526" y="402" fill="#FEF3C7" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Risoto de Cogumelos</text>
