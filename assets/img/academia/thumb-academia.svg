<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Prévia do projeto demonstrativo Pulso Fit — Academia &amp; Performance">
  <defs>
    <linearGradient id="fit-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C2D12"/>
      <stop offset="50%" stop-color="#C2410C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="fit-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="#120D0A"/>
  <rect width="800" height="500" fill="url(#fit-bg)" opacity="0.22"/>

  <!-- Browser Window Chrome -->
  <rect x="36" y="28" width="728" height="444" rx="16" fill="#1E140F" stroke="#3D2419" stroke-width="1.5"/>
  <rect x="36" y="28" width="728" height="48" rx="16" fill="#140D0A"/>
  <line x1="36" y1="76" x2="764" y2="76" stroke="#3D2419" stroke-width="1"/>
  
  <!-- Window Dots -->
  <circle cx="58" cy="52" r="5" fill="#EF4444"/>
  <circle cx="74" cy="52" r="5" fill="#F59E0B"/>
  <circle cx="90" cy="52" r="5" fill="#10B981"/>
  <text x="110" y="56" fill="#FDBA74" font-family="monospace" font-size="11">pulsofit.demo/planos</text>

  <!-- Navbar inside mockup -->
  <rect x="510" y="40" width="230" height="24" rx="6" fill="#2B1A12"/>
  <text x="625" y="56" fill="#FFEDD5" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Modalidades • Grade • Agendar Free Pass</text>

  <!-- Hero Content Left -->
  <rect x="68" y="104" width="168" height="24" rx="12" fill="#431407" stroke="#EA580C"/>
  <circle cx="84" cy="116" r="4" fill="#F97316"/>
  <text x="152" y="120" fill="#FED7AA" font-family="monospace" font-size="9.5" font-weight="700" text-anchor="middle">ACADEMIA &amp; PERFORMANCE</text>

  <text x="68" y="164" fill="#FFF7ED" font-family="system-ui, sans-serif" font-size="28" font-weight="800">Treine com foco,</text>
  <text x="68" y="196" fill="#FB923C" font-family="system-ui, sans-serif" font-size="28" font-weight="800">supere metas.</text>
  <text x="68" y="226" fill="#A8A29E" font-family="system-ui, sans-serif" font-size="12">Comparador de planos, grade de horários de aulas</text>
  <text x="68" y="244" fill="#A8A29E" font-family="system-ui, sans-serif" font-size="12">e captação de alunos via passe livre experimental.</text>

  <rect x="68" y="266" width="140" height="34" rx="8" fill="url(#fit-orange)"/>
  <text x="138" y="287" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">Garantir Free Pass</text>

  <!-- Pricing Cards Grid Right -->
  <rect x="440" y="104" width="290" height="190" rx="12" fill="#241812" stroke="#48291C"/>
  <text x="460" y="132" fill="#FDBA74" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Planos &amp; Modalidades</text>
  
  <rect x="460" y="148" width="250" height="38" rx="8" fill="#180F0A"/>
  <text x="475" y="171" fill="#E5E7EB" font-family="system-ui, sans-serif" font-size="11">Plano Smart • Musculação</text>
  <text x="680" y="171" fill="#FB923C" font-family="monospace" font-size="11" font-weight="700">R$ 99/mês</text>

  <rect x="460" y="194" width="250" height="38" rx="8" fill="#180F0A" stroke="#EA580C" stroke-width="1.2"/>
  <text x="475" y="217" fill="#FFF7ED" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Plano Prime • Todas Aulas + Box</text>
  <text x="675" y="217" fill="#F97316" font-family="monospace" font-size="11" font-weight="700">R$ 149/mês</text>

  <rect x="460" y="240" width="250" height="38" rx="8" fill="#180F0A"/>
  <text x="475" y="263" fill="#E5E7EB" font-family="system-ui, sans-serif" font-size="11">Personal Individual + Bioimpedância</text>
  <text x="675" y="263" fill="#F59E0B" font-family="monospace" font-size="11" font-weight="700">R$ 280/mês</text>

  <!-- Feature Strip Bottom -->
  <rect x="68" y="320" width="662" height="126" rx="12" fill="#221610" stroke="#3D2419"/>
  <rect x="90" y="340" width="190" height="86" rx="8" fill="#160E0A"/>
  <text x="105" y="365" fill="#FB923C" font-family="system-ui, sans-serif" font-size="11" font-weight="700">⚡ Grade Interativa</text>
  <text x="105" y="388" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="10">Spinning, Pilates, Cross e Dança</text>

  <rect x="300" y="340" width="190" height="86" rx="8" fill="#160E0A"/>
  <text x="315" y="365" fill="#FB923C" font-family="system-ui, sans-serif" font-size="11" font-weight="700">⚡ Cálculo de Metas</text>
  <text x="315" y="388" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="10">Simulador de frequência e objetivos</text>

  <rect x="510" y="340" width="200" height="86" rx="8" fill="#160E0A"/>
  <text x="525" y="365" fill="#FB923C" font-family="system-ui, sans-serif" font-size="11" font-weight="700">⚡ Conversão Direta</text>
  <text x="525" y="388" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="10">Captação rápida com formulário mobile</text>
</svg>
