<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Prévia do projeto demonstrativo Clínica Vitae — Saúde Integrada">
  <defs>
    <linearGradient id="clin-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041E1C"/>
      <stop offset="55%" stop-color="#072D2B"/>
      <stop offset="100%" stop-color="#0B3B3C"/>
    </linearGradient>
    <linearGradient id="clin-teal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <radialGradient id="clin-glow" cx="78%" cy="22%" r="45%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#clin-bg)"/>
  <rect width="800" height="500" fill="url(#clin-glow)"/>

  <!-- Main Interface Canvas -->
  <rect x="36" y="28" width="728" height="444" rx="16" fill="#072220" stroke="#134E4A" stroke-width="1.5"/>
  <rect x="36" y="28" width="728" height="48" rx="16" fill="#041918"/>
  <line x1="36" y1="76" x2="764" y2="76" stroke="#11423F" stroke-width="1"/>
  <rect x="56" y="42" width="20" height="20" rx="6" fill="url(#clin-teal)"/>
  <text x="84" y="57" fill="#F0FDFA" font-family="system-ui, sans-serif" font-size="14" font-weight="800">Clínica Vitae</text>
  <text x="455" y="56" fill="#99F6E4" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Especialidades   Corpo Clínico   Dúvidas</text>
  <rect x="650" y="39" width="92" height="26" rx="13" fill="url(#clin-teal)"/>
  <text x="696" y="56" fill="#042F2E" font-family="system-ui, sans-serif" font-size="10" font-weight="800" text-anchor="middle">Agendamento</text>

  <!-- Hero Content -->
  <rect x="68" y="104" width="160" height="22" rx="11" fill="#0B3B38" stroke="#0F766E"/>
  <circle cx="82" cy="115" r="3.5" fill="#2DD4BF"/>
  <text x="152" y="119" fill="#5EEAD4" font-family="monospace" font-size="9.5" font-weight="700" text-anchor="middle">MEDICINA PREVENTIVA</text>

  <text x="68" y="164" fill="#F0FDFA" font-family="system-ui, sans-serif" font-size="33" font-weight="800">Cuidado médico com</text>
  <text x="68" y="202" fill="#2DD4BF" font-family="system-ui, sans-serif" font-size="33" font-weight="800">clareza e acolhimento.</text>
  <text x="68" y="232" fill="#99F6E4" font-family="system-ui, sans-serif" font-size="13">Jornada do paciente simplificada, especialidades clínicas,</text>
  <text x="68" y="250" fill="#99F6E4" font-family="system-ui, sans-serif" font-size="13">orientações pré-consulta e acessibilidade AA.</text>

  <rect x="68" y="270" width="146" height="36" rx="8" fill="url(#clin-teal)"/>
  <text x="141" y="293" fill="#042F2E" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">Ver Especialidades</text>
  <rect x="224" y="270" width="124" height="36" rx="8" fill="#0B2E2C" stroke="#115E59"/>
  <text x="286" y="293" fill="#CCFBF1" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">Como Funciona</text>

  <!-- Right Clinical Dashboard Preview -->
  <rect x="468" y="98" width="264" height="208" rx="14" fill="#0A2E2C" stroke="#115E59"/>
  <text x="490" y="128" fill="#5EEAD4" font-family="monospace" font-size="10" font-weight="700">JORNADA DO PACIENTE • 4 ETAPAS</text>
  <rect x="490" y="142" width="220" height="34" rx="8" fill="#061E1D" stroke="#134E4A"/>
  <circle cx="508" cy="159" r="8" fill="#14B8A6"/>
  <text x="524" y="163" fill="#F0FDFA" font-family="system-ui, sans-serif" font-size="11" font-weight="600">1. Escolha da Especialidade</text>

  <rect x="490" y="184" width="220" height="34" rx="8" fill="#061E1D" stroke="#134E4A"/>
  <circle cx="508" cy="201" r="8" fill="#0D9488"/>
  <text x="524" y="205" fill="#F0FDFA" font-family="system-ui, sans-serif" font-size="11" font-weight="600">2. Pré-Agendamento Guiado</text>

  <rect x="490" y="226" width="220" height="34" rx="8" fill="#061E1D" stroke="#134E4A"/>
  <circle cx="508" cy="243" r="8" fill="#2DD4BF"/>
  <text x="524" y="247" fill="#F0FDFA" font-family="system-ui, sans-serif" font-size="11" font-weight="600">3. Preparo &amp; Acolhimento</text>

  <text x="490" y="286" fill="#99F6E4" font-family="monospace" font-size="10">✓ Contraste WCAG AA • Leitura Clara</text>

  <!-- Specialties Cards Row -->
  <rect x="68" y="330" width="208" height="118" rx="12" fill="#0A2E2C" stroke="#115E59"/>
  <rect x="86" y="346" width="28" height="28" rx="7" fill="#134E4A"/>
  <text x="100" y="365" fill="#2DD4BF" font-family="system-ui, sans-serif" font-size="15" font-weight="800" text-anchor="middle">+</text>
  <text x="86" y="396" fill="#F0FDFA" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Clínica Médica</text>
  <text x="86" y="416" fill="#99F6E4" font-family="system-ui, sans-serif" font-size="11">Check-up preventivo integral</text>

  <rect x="296" y="330" width="208" height="118" rx="12" fill="#0A2E2C" stroke="#115E59"/>
  <rect x="314" y="346" width="28" height="28" rx="7" fill="#134E4A"/>
  <text x="328" y="365" fill="#2DD4BF" font-family="system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="middle">♥</text>
  <text x="314" y="396" fill="#F0FDFA" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Cardiologia</text>
  <text x="314" y="416" fill="#99F6E4" font-family="system-ui, sans-serif" font-size="11">Avaliação e risco cirúrgico</text>

  <rect x="524" y="330" width="208" height="118" rx="12" fill="#0A2E2C" stroke="#115E59"/>
  <rect x="542" y="346" width="28" height="28" rx="7" fill="#134E4A"/>
  <text x="556" y="365" fill="#2DD4BF" font-family="system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="middle">✦</text>
  <text x="542" y="396" fill="#F0FDFA" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Dermatologia</text>
  <text x="542" y="416" fill="#99F6E4" font-family="system-ui, sans-serif" font-size="11">Protocolos clínicos da pele</text>
</svg>
