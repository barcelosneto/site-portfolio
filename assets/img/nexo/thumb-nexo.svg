<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Prévia do projeto demonstrativo Nexo Academy — Plataforma de Cursos &amp; Treinamentos">
  <defs>
    <linearGradient id="nexo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="50%" stop-color="#4338CA"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="nexo-indigo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="#0A0915"/>
  <rect width="800" height="500" fill="url(#nexo-bg)" opacity="0.25"/>

  <!-- Browser Window Chrome -->
  <rect x="36" y="28" width="728" height="444" rx="16" fill="#131226" stroke="#2D2A57" stroke-width="1.5"/>
  <rect x="36" y="28" width="728" height="48" rx="16" fill="#0C0B1B"/>
  <line x1="36" y1="76" x2="764" y2="76" stroke="#2D2A57" stroke-width="1"/>
  
  <!-- Window Dots -->
  <circle cx="58" cy="52" r="5" fill="#EF4444"/>
  <circle cx="74" cy="52" r="5" fill="#F59E0B"/>
  <circle cx="90" cy="52" r="5" fill="#10B981"/>
  <text x="110" y="56" fill="#A5B4FC" font-family="monospace" font-size="11">nexoacademy.demo/trilhas</text>

  <!-- Navbar inside mockup -->
  <rect x="520" y="40" width="220" height="24" rx="6" fill="#201D47"/>
  <text x="630" y="56" fill="#E0E7FF" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Trilhas • Comparador • Certificados</text>

  <!-- Hero Content Left -->
  <rect x="68" y="104" width="180" height="24" rx="12" fill="#1E1B4B" stroke="#6366F1"/>
  <circle cx="84" cy="116" r="4" fill="#818CF8"/>
  <text x="160" y="120" fill="#C7D2FE" font-family="monospace" font-size="9.5" font-weight="700" text-anchor="middle">EDUCAÇÃO &amp; TECNOLOGIA</text>

  <text x="68" y="164" fill="#EEF2FF" font-family="system-ui, sans-serif" font-size="28" font-weight="800">Acelere sua carreira</text>
  <text x="68" y="196" fill="#818CF8" font-family="system-ui, sans-serif" font-size="28" font-weight="800">em tecnologia.</text>
  <text x="68" y="226" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Catálogo inteligente com busca sem acentos,</text>
  <text x="68" y="244" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">comparador de trilhas e mentoria ao vivo.</text>

  <rect x="68" y="266" width="140" height="34" rx="8" fill="url(#nexo-indigo)"/>
  <text x="138" y="287" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">Explorar Cursos</text>

  <!-- Course Cards Grid Right -->
  <rect x="440" y="104" width="290" height="190" rx="12" fill="#181636" stroke="#37336D"/>
  <text x="460" y="132" fill="#C7D2FE" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Trilhas de Especialização</text>
  
  <rect x="460" y="148" width="250" height="38" rx="8" fill="#100E26"/>
  <text x="475" y="171" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">Front-End Moderno: React &amp; Next.js</text>
  <text x="675" y="171" fill="#818CF8" font-family="monospace" font-size="11" font-weight="700">120h</text>

  <rect x="460" y="194" width="250" height="38" rx="8" fill="#100E26" stroke="#6366F1" stroke-width="1.2"/>
  <text x="475" y="217" fill="#EEF2FF" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Back-End &amp; APIs com Python e Postgres</text>
  <text x="675" y="217" fill="#A5B4FC" font-family="monospace" font-size="11" font-weight="700">140h</text>

  <rect x="460" y="240" width="250" height="38" rx="8" fill="#100E26"/>
  <text x="475" y="263" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">Data Science &amp; IA Aplicada a Negócios</text>
  <text x="675" y="263" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="700">160h</text>

  <!-- Feature Strip Bottom -->
  <rect x="68" y="320" width="662" height="126" rx="12" fill="#161430" stroke="#2D2A57"/>
  <rect x="90" y="340" width="190" height="86" rx="8" fill="#0F0E24"/>
  <text x="105" y="365" fill="#818CF8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">◈ Filtros Multicritério</text>
  <text x="105" y="388" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Por nível, duração e tecnologia</text>

  <rect x="300" y="340" width="190" height="86" rx="8" fill="#0F0E24"/>
  <text x="315" y="365" fill="#818CF8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">◈ Comparador de Ementas</text>
  <text x="315" y="388" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Compare módulos lado a lado</text>

  <rect x="510" y="340" width="200" height="86" rx="8" fill="#0F0E24"/>
  <text x="525" y="365" fill="#818CF8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">◈ Foco em Empregabilidade</text>
  <text x="525" y="388" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Projetos práticos para portfólio</text>
</svg>
