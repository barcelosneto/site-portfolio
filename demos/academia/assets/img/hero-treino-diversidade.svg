<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" role="img" aria-label="Ilustração do estúdio Pulso Fit com adultos de diferentes faixas etárias treinando acompanhados por instrutora">
  <defs>
    <linearGradient id="studioBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14171A" />
      <stop offset="100%" stop-color="#1F242B" />
    </linearGradient>
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#191C20" />
      <stop offset="100%" stop-color="#0E1012" />
    </linearGradient>
    <linearGradient id="limeAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C8FF00" />
      <stop offset="100%" stop-color="#9BD600" />
    </linearGradient>
  </defs>

  <!-- Studio background -->
  <rect width="900" height="660" rx="24" fill="url(#studioBg)" />

  <!-- Architectural lighting strips -->
  <line x1="60" y1="55" x2="840" y2="55" stroke="#C8FF00" stroke-width="4" stroke-linecap="round" opacity="0.85" />
  <line x1="120" y1="90" x2="780" y2="90" stroke="#C8FF00" stroke-width="2" stroke-linecap="round" opacity="0.35" />

  <!-- Studio window & acoustic panels -->
  <rect x="60" y="120" width="230" height="290" rx="12" fill="#111315" stroke="#2B313A" stroke-width="2" />
  <line x1="175" y1="120" x2="175" y2="410" stroke="#2B313A" stroke-width="2" />
  <line x1="60" y1="265" x2="290" y2="265" stroke="#2B313A" stroke-width="2" />

  <!-- Power Rack / Rig in middle-right -->
  <rect x="590" y="115" width="230" height="355" fill="none" stroke="#363E4A" stroke-width="8" rx="6" />
  <line x1="590" y1="165" x2="820" y2="165" stroke="#C8FF00" stroke-width="5" />
  <line x1="635" y1="115" x2="635" y2="470" stroke="#2B313A" stroke-width="5" />
  <line x1="775" y1="115" x2="775" y2="470" stroke="#2B313A" stroke-width="5" />

  <!-- Floor -->
  <path d="M 0 470 L 900 470 L 900 660 L 0 660 Z" fill="url(#floorGrad)" />
  <line x1="0" y1="470" x2="900" y2="470" stroke="#2D333B" stroke-width="3" />
  <!-- Turf lane lines -->
  <line x1="120" y1="530" x2="780" y2="530" stroke="#C8FF00" stroke-width="2" stroke-dasharray="16 14" opacity="0.5" />
  <line x1="80" y1="595" x2="820" y2="595" stroke="#C8FF00" stroke-width="3" opacity="0.7" />

  <!-- Person 1 (Left): Active 58+ Senior Man doing Kettlebell Goblet Squat with poise -->
  <g transform="translate(155, 240)">
    <!-- Shadow -->
    <ellipse cx="55" cy="260" rx="52" ry="12" fill="#08090A" opacity="0.7" />
    <!-- Legs in controlled squat -->
    <path d="M 35 160 L 20 210 L 28 252" fill="none" stroke="#38BDF8" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 75 160 L 90 210 L 82 252" fill="none" stroke="#38BDF8" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Shoes -->
    <rect x="12" y="246" width="28" height="12" rx="6" fill="#F8FAFC" />
    <rect x="70" y="246" width="28" height="12" rx="6" fill="#F8FAFC" />
    <!-- Torso -->
    <rect x="30" y="78" width="50" height="88" rx="18" fill="#334155" stroke="#475569" stroke-width="2" />
    <!-- Head & silver hair/beard (58+ diversity representation) -->
    <circle cx="55" cy="46" r="24" fill="#D99B78" />
    <path d="M 33 40 C 33 20, 77 20, 77 40 C 70 30, 40 30, 33 40 Z" fill="#E2E8F0" />
    <path d="M 39 54 Q 55 70 71 54" fill="none" stroke="#E2E8F0" stroke-width="5" stroke-linecap="round" />
    <!-- Arms holding Kettlebell -->
    <path d="M 32 95 L 44 128 L 55 118" fill="none" stroke="#D99B78" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 78 95 L 66 128 L 55 118" fill="none" stroke="#D99B78" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Kettlebell -->
    <circle cx="55" cy="134" r="18" fill="#111315" stroke="#C8FF00" stroke-width="3" />
    <path d="M 43 118 H 67" stroke="#C8FF00" stroke-width="4" stroke-linecap="round" />
    <!-- Label tag -->
    <rect x="-25" y="-12" width="160" height="28" rx="14" fill="#111315" stroke="#38BDF8" stroke-width="1.5" />
    <text x="55" y="7" text-anchor="middle" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="700">60+ • Força &amp; Mobilidade</text>
  </g>

  <!-- Person 2 (Center): Coach/Instructor guiding movement with tablet & posture cue -->
  <g transform="translate(385, 215)">
    <ellipse cx="60" cy="285" rx="48" ry="12" fill="#08090A" opacity="0.7" />
    <path d="M 44 175 L 40 275" fill="none" stroke="#1E293B" stroke-width="18" stroke-linecap="round" />
    <path d="M 76 175 L 82 275" fill="none" stroke="#1E293B" stroke-width="18" stroke-linecap="round" />
    <rect x="26" y="270" width="28" height="12" rx="6" fill="#C8FF00" />
    <rect x="70" y="270" width="28" height="12" rx="6" fill="#C8FF00" />
    <!-- Coach shirt with Lime accent -->
    <rect x="34" y="82" width="52" height="96" rx="18" fill="#111315" stroke="#C8FF00" stroke-width="2.5" />
    <path d="M 45 112 L 54 98 L 62 122 L 69 106 L 77 112" fill="none" stroke="#C8FF00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Head (Black woman coach with afro puff hair) -->
    <circle cx="60" cy="48" r="23" fill="#7C4728" />
    <circle cx="60" cy="18" r="18" fill="#111315" />
    <path d="M 38 42 C 42 24, 78 24, 82 42" fill="#111315" />
    <!-- Arms holding clipboard/tablet and gesturing -->
    <path d="M 35 96 L 12 122 L 26 140" fill="none" stroke="#7C4728" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 85 96 L 116 78" fill="none" stroke="#7C4728" stroke-width="11" stroke-linecap="round" />
    <rect x="18" y="125" width="26" height="34" rx="4" fill="#262B33" stroke="#C8FF00" stroke-width="2" />
    <!-- Badge -->
    <rect x="-25" y="-18" width="170" height="28" rx="14" fill="#C8FF00" />
    <text x="60" y="1" text-anchor="middle" fill="#111315" font-family="system-ui, sans-serif" font-size="12" font-weight="800">Acompanhamento Próximo</text>
  </g>

  <!-- Person 3 (Right): Adult 32 yrs doing Dumbbell Overhead Press near Rack -->
  <g transform="translate(645, 200)">
    <ellipse cx="60" cy="300" rx="52" ry="12" fill="#08090A" opacity="0.7" />
    <!-- Legs -->
    <path d="M 42 190 L 36 290" fill="none" stroke="#27272A" stroke-width="18" stroke-linecap="round" />
    <path d="M 78 190 L 84 290" fill="none" stroke="#27272A" stroke-width="18" stroke-linecap="round" />
    <rect x="22" y="285" width="28" height="12" rx="6" fill="#F8FAFC" />
    <rect x="72" y="285" width="28" height="12" rx="6" fill="#F8FAFC" />
    <!-- Torso -->
    <rect x="33" y="96" width="54" height="98" rx="18" fill="url(#limeAccent)" />
    <!-- Head -->
    <circle cx="60" cy="62" r="23" fill="#B97A56" />
    <path d="M 38 56 C 40 34, 80 34, 82 56 Z" fill="#1E1B18" />
    <!-- Raised arms pressing dumbbells -->
    <path d="M 34 108 L 16 72 L 22 30" fill="none" stroke="#B97A56" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 86 108 L 104 72 L 98 30" fill="none" stroke="#B97A56" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Dumbbells -->
    <rect x="4" y="20" width="36" height="12" rx="4" fill="#F8FAFC" />
    <rect x="80" y="20" width="36" height="12" rx="4" fill="#F8FAFC" />
    <!-- Badge -->
    <rect x="-15" y="-22" width="150" height="28" rx="14" fill="#111315" stroke="#C8FF00" stroke-width="1.5" />
    <text x="60" y="-3" text-anchor="middle" fill="#C8FF00" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Turmas Reduzidas</text>
  </g>

  <!-- Bottom HUD status bar (Illustrative studio metrics) -->
  <rect x="45" y="565" width="810" height="62" rx="14" fill="#111315" opacity="0.92" stroke="#2E3540" stroke-width="1.5" />
  <circle cx="82" cy="596" r="8" fill="#C8FF00" />
  <text x="102" y="601" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="15" font-weight="700">AMBIENTE ACOLHEDOR • DIVERSIDADE ETÁRIA (20 A 70+ ANOS)</text>
  <text x="825" y="601" text-anchor="end" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">ILUSTRAÇÃO DEMONSTRATIVA</text>
</svg>
