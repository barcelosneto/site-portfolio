<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-label="Ilustração de Treinamento Funcional com pista de grama sintética, kettlebells, corda naval e caixas pliométricas">
  <defs>
    <linearGradient id="bgM2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121518" />
      <stop offset="100%" stop-color="#1E242B" />
    </linearGradient>
  </defs>
  <rect width="640" height="420" rx="18" fill="url(#bgM2)" />
  <!-- Sprint turf track -->
  <rect x="40" y="295" width="560" height="75" rx="10" fill="#17241A" stroke="#C8FF00" stroke-width="2" opacity="0.9" />
  <line x1="90" y1="332" x2="550" y2="332" stroke="#C8FF00" stroke-width="3" stroke-dasharray="18 14" />
  <!-- Plyo box -->
  <polygon points="120,295 150,195 255,195 285,295" fill="#232931" stroke="#C8FF00" stroke-width="3" />
  <text x="202" y="255" text-anchor="middle" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="22" font-weight="800">60 cm</text>
  <!-- Kettlebells -->
  <g transform="translate(345, 225)">
    <path d="M 18 22 C 18 4, 46 4, 46 22" fill="none" stroke="#F8FAFC" stroke-width="6" stroke-linecap="round" />
    <circle cx="32" cy="45" r="25" fill="#111315" stroke="#C8FF00" stroke-width="3" />
    <text x="32" y="50" text-anchor="middle" fill="#C8FF00" font-family="system-ui, sans-serif" font-size="13" font-weight="800">12kg</text>
  </g>
  <g transform="translate(430, 210)">
    <path d="M 20 26 C 20 5, 54 5, 54 26" fill="none" stroke="#F8FAFC" stroke-width="7" stroke-linecap="round" />
    <circle cx="37" cy="54" r="30" fill="#111315" stroke="#38BDF8" stroke-width="3" />
    <text x="37" y="60" text-anchor="middle" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="14" font-weight="800">16kg</text>
  </g>
  <!-- Battle ropes wave -->
  <path d="M 70 140 Q 145 75, 220 140 T 370 140 T 520 140" fill="none" stroke="#C8FF00" stroke-width="7" stroke-linecap="round" />
  <path d="M 70 162 Q 145 105, 220 162 T 370 162 T 520 162" fill="none" stroke="#94A3B8" stroke-width="5" stroke-linecap="round" opacity="0.65" />
  <!-- Tag -->
  <rect x="40" y="34" width="245" height="32" rx="16" fill="#111315" stroke="#C8FF00" stroke-width="1.5" />
  <text x="162" y="55" text-anchor="middle" fill="#C8FF00" font-family="system-ui, sans-serif" font-size="13" font-weight="700">TREINAMENTO FUNCIONAL</text>
</svg>
