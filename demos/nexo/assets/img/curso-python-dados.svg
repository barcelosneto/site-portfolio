  <text x="40" y="82" fill="#22D3EE" font-family="monospace" font-size="13">def</text>
  <text x="72" y="82" fill="#F8FAFC" font-family="monospace" font-size="13">processar_base(df):</text>
  <text x="56" y="106" fill="#94A3B8" font-family="monospace" font-size="12">df = df.dropna(subset=['receita'])</text>
  <text x="56" y="128" fill="#A78BFA" font-family="monospace" font-size="12">return df.groupby('regiao').sum()</text>
