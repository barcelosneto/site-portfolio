  <text x="402" y="114" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Dashboard Executivo DAX</text>
  <text x="402" y="132" fill="#64748B" font-family="system-ui, sans-serif" font-size="11">Simulação de indicadores operacionais</text>

