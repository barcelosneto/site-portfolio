<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" role="img" aria-label="Interface ilustrativa da plataforma de projetos práticos Nexo Academy com código Python, indicadores de Power BI e fluxo de IA">
  <defs>
    <linearGradient id="panelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1E30" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
