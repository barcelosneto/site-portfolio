  <rect x="452" y="185" width="28" height="95" rx="6" fill="url(#barCyan)" />
  <rect x="494" y="160" width="28" height="120" rx="6" fill="url(#barViolet)" />
  <rect x="536" y="145" width="28" height="135" rx="6" fill="url(#barCyan)" />
  <rect x="578" y="128" width="28" height="152" rx="6" fill="url(#barViolet)" />

  <!-- Trend Line -->
  <polyline points="424,205 466,175 508,152 550,138 592,118" fill="none" stroke="#22D3EE" stroke-width="3" stroke-linecap="round" />
  <circle cx="592" cy="118" r="5" fill="#22D3EE" />

  <!-- Bottom Cards: Excel + AI Prompt Flow -->
  <rect x="44" y="328" width="285" height="134" rx="14" fill="#091828" stroke="#1E3A5F" stroke-width="1.5" />
  <rect x="62" y="346" width="88" height="24" rx="6" fill="#11324D" />
  <text x="106" y="362" text-anchor="middle" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">EXCEL + VBA</text>
  <text x="62" y="392" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Modelagem Financeira Dinâmica</text>
  <text x="62" y="414" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Power Query, Tabelas Dinâmicas e PROCX</text>
  <rect x="62" y="428" width="248" height="18" rx="9" fill="#0F2942" />
  <rect x="62" y="428" width="198" height="18" rx="9" fill="url(#cyanViolet)" />

  <rect x="347" y="328" width="289" height="134" rx="14" fill="#13112C" stroke="#4C1D95" stroke-width="1.5" />
  <rect x="365" y="346" width="110" height="24" rx="6" fill="#2E1065" />
  <text x="420" y="362" text-anchor="middle" fill="#C4B5FD" font-family="system-ui, sans-serif" font-size="11" font-weight="700">IA GENERATIVA</text>
  <text x="365" y="392" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Engenharia de Prompt &amp; Agentes</text>
  <text x="365" y="414" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12">Automação de relatórios e análise assistida</text>
