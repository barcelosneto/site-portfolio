  <text x="120" y="51" fill="#94A3B8" font-family="monospace" font-size="13">nexo-lab // pipeline_vendas_ia.py — Projeto Guiado</text>

  <!-- Code Editor Panel (Left) -->
  <rect x="44" y="86" width="320" height="225" rx="14" fill="#06101B" stroke="#1E293B" stroke-width="1.5" />
  <text x="62" y="114" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="700">import</text>
  <text x="114" y="114" fill="#E2E8F0" font-family="monospace" font-size="12">pandas as pd</text>
  <text x="62" y="136" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="700">from</text>
  <text x="98" y="136" fill="#E2E8F0" font-family="monospace" font-size="12">nexo_ai import PromptEngine</text>

  <text x="62" y="166" fill="#94A3B8" font-family="monospace" font-size="11"># 1. Limpeza e modelagem de dados</text>
  <text x="62" y="186" fill="#A78BFA" font-family="monospace" font-size="12">df = pd.read_parquet(</text>
  <text x="212" y="186" fill="#34D399" font-family="monospace" font-size="12">"operacoes.parquet"</text>
  <text x="345" y="186" fill="#A78BFA" font-family="monospace" font-size="12">)</text>
  <text x="62" y="208" fill="#E2E8F0" font-family="monospace" font-size="12">kpi_margem = df.groupby(</text>
  <text x="234" y="208" fill="#FBBF24" font-family="monospace" font-size="12">"canal"</text>
  <text x="285" y="208" fill="#E2E8F0" font-family="monospace" font-size="12">).agg()</text>

  <rect x="62" y="228" width="284" height="64" rx="10" fill="#0D2235" stroke="#06B6D4" stroke-opacity="0.4" />
  <circle cx="82" cy="248" r="5" fill="#22D3EE" />
  <text x="96" y="252" fill="#22D3EE" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Pipeline executado sem erros</text>
  <text x="96" y="274" fill="#94A3B8" font-family="monospace" font-size="11">14.820 linhas • Exportado para Power BI</text>

  <!-- Right BI Widget -->
