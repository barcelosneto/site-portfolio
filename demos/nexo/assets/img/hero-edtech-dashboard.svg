    <text x="37" y="15" text-anchor="middle" fill="#DDD6FE" font-family="monospace" font-size="10">Prompt</text>
    <line x1="74" y1="11" x2="94" y2="11" stroke="#8B5CF6" stroke-width="2" />
    <rect x="94" width="74" height="22" rx="6" fill="#1E1B4B" stroke="#22D3EE" />
    <text x="131" y="15" text-anchor="middle" fill="#A5F3FC" font-family="monospace" font-size="10">Validação</text>
    <line x1="168" y1="11" x2="188" y2="11" stroke="#22D3EE" stroke-width="2" />
