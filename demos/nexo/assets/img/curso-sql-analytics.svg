<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" role="img" aria-label="Ilustração do curso SQL e Modelagem Analítica com Python">
  <rect width="400" height="220" rx="16" fill="#081A2B" />
  <rect x="24" y="24" width="352" height="172" rx="12" fill="#05101A" stroke="#38BDF8" stroke-opacity="0.4" />
  <text x="44" y="64" fill="#38BDF8" font-family="monospace" font-size="13" font-weight="700">SELECT</text>
  <text x="102" y="64" fill="#E2E8F0" font-family="monospace" font-size="13">cliente_id, SUM(ticket) AS ltv</text>
  <text x="44" y="88" fill="#38BDF8" font-family="monospace" font-size="13" font-weight="700">FROM</text>
  <text x="88" y="88" fill="#E2E8F0" font-family="monospace" font-size="13">f_transacoes</text>
  <text x="44" y="112" fill="#A78BFA" font-family="monospace" font-size="13" font-weight="700">GROUP BY</text>
  <text x="118" y="112" fill="#E2E8F0" font-family="monospace" font-size="13">1 HAVING SUM(ticket) &gt; 5000;</text>
  <rect x="44" y="138" width="312" height="36" rx="8" fill="#0D2840" />
  <text x="200" y="160" text-anchor="middle" fill="#7DD3FC" font-family="system-ui, sans-serif" font-size="11" font-weight="700">SQL ANALÍTICO • PYTHON CONECTADO</text>
</svg>
