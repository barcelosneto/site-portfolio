<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="Comparativo ilustrativo Antes e Depois: Shih Tzu com tosa bebê na tesoura">
  <rect width="640" height="420" rx="24" fill="#FAF6F0"/>
  <!-- Left Side: ANTES -->
  <rect x="16" y="16" width="296" height="388" rx="18" fill="#EFE7DA"/>
  <rect x="32" y="32" width="92" height="30" rx="15" fill="#6E6256"/>
  <text x="78" y="52" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#FAF6F0">ANTES</text>
  <g transform="translate(84, 102)">
    <ellipse cx="80" cy="175" rx="64" ry="55" fill="#D8CFC2"/>
    <circle cx="80" cy="95" r="56" fill="#E5DDD0"/>
    <!-- Long bangs covering eyes -->
    <path d="M42 65 Q62 110 80 95 Q98 110 118 65" fill="#C4B8A8"/>
    <ellipse cx="80" cy="106" rx="9" ry="6" fill="#2A2421"/>
    <path d="M46 112 Q80 148 114 112" fill="#C4B8A8" opacity="0.7"/>
  </g>
  <text x="164" y="376" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#5C5349">Franja longa cobrindo os olhos</text>

  <!-- Right Side: DEPOIS -->
  <rect x="328" y="16" width="296" height="388" rx="18" fill="#F9E8E3"/>
  <rect x="344" y="32" width="98" height="30" rx="15" fill="#E06D53"/>
  <text x="393" y="52" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#FAF6F0">DEPOIS</text>
  <g transform="translate(396, 102)">
    <ellipse cx="80" cy="175" rx="52" ry="48" fill="#FAF6F0"/>
    <circle cx="80" cy="95" r="48" fill="#FAF6F0"/>
    <ellipse cx="35" cy="98" rx="14" ry="28" fill="#C9B8A3"/>
    <ellipse cx="125" cy="98" rx="14" ry="28" fill="#C9B8A3"/>
    <!-- Top knot bow -->
    <polygon points="80,46 64,36 64,56" fill="#4A6B5D"/>
    <polygon points="80,46 96,36 96,56" fill="#4A6B5D"/>
    <circle cx="80" cy="46" r="5" fill="#E06D53"/>
    <!-- Clear bright eyes -->
    <circle cx="62" cy="88" r="6.5" fill="#2A2421"/>
    <circle cx="60" cy="86" r="2" fill="#FFFFFF"/>
    <circle cx="98" cy="88" r="6.5" fill="#2A2421"/>
    <circle cx="96" cy="86" r="2" fill="#FFFFFF"/>
    <ellipse cx="80" cy="100" rx="8" ry="5.5" fill="#2A2421"/>
    <path d="M68 112 Q80 120 92 112" stroke="#2A2421" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <text x="476" y="376" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#8C3725">Tosa bebê na tesoura e olhos livres</text>
  <rect x="200" y="388" width="240" height="24" rx="12" fill="#2A3630"/>
  <text x="320" y="404" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#FAF6F0">ARTE ILUSTRATIVA DEMONSTRATIVA</text>
</svg>
