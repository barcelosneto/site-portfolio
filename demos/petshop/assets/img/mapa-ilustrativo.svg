<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="Mapa ilustrativo de localização demonstrativa do estúdio Pata e Prosa">
  <rect width="640" height="420" rx="28" fill="#E7EFEA"/>
  <!-- Park & Green blocks -->
  <rect x="28" y="28" width="210" height="150" rx="22" fill="#CFE0D6"/>
  <rect x="410" y="230" width="202" height="162" rx="22" fill="#CFE0D6"/>
  <rect x="28" y="220" width="290" height="172" rx="22" fill="#EFE8DC"/>
  <rect x="280" y="28" width="332" height="150" rx="22" fill="#EFE8DC"/>
  <!-- Roads -->
  <rect x="0" y="178" width="640" height="44" fill="#FAF6F0"/>
  <rect x="238" y="0" width="44" height="420" fill="#FAF6F0"/>
  <line x1="0" y1="200" x2="640" y2="200" stroke="#D5CBBF" stroke-width="3" stroke-dasharray="12 10"/>
  <line x1="260" y1="0" x2="260" y2="420" stroke="#D5CBBF" stroke-width="3" stroke-dasharray="12 10"/>
  <!-- Trees -->
  <circle cx="90" cy="88" r="24" fill="#688B7B"/>
  <circle cx="135" cy="112" r="18" fill="#4A6B5D"/>
  <circle cx="515" cy="300" r="28" fill="#688B7B"/>
  <circle cx="470" cy="330" r="20" fill="#4A6B5D"/>
  <!-- Street labels -->
  <text x="455" y="195" font-family="sans-serif" font-size="12" font-weight="700" fill="#5C6B64">RUA DAS MAGNÓLIAS (EXEMPLO)</text>
  <!-- Location Pin -->
  <g transform="translate(310, 82)">
    <ellipse cx="45" cy="108" rx="26" ry="9" fill="#2A3630" opacity="0.22"/>
    <path d="M45 10 C18 10, 0 30, 0 55 C0 82, 45 108, 45 108 C45 108, 90 82, 90 55 C90 30, 72 10, 45 10 Z" fill="#E06D53"/>
    <circle cx="45" cy="52" r="24" fill="#FAF6F0"/>
    <!-- Paw inside pin -->
    <circle cx="45" cy="56" r="7" fill="#4A6B5D"/>
    <circle cx="36" cy="46" r="3.5" fill="#4A6B5D"/>
    <circle cx="42" cy="43" r="3.5" fill="#4A6B5D"/>
    <circle cx="48" cy="43" r="3.5" fill="#4A6B5D"/>
    <circle cx="54" cy="46" r="3.5" fill="#4A6B5D"/>
  </g>
  <!-- Info Card on Map -->
  <rect x="44" y="250" width="258" height="118" rx="18" fill="#FAF6F0" stroke="#D8CFC2" stroke-width="2"/>
  <text x="64" y="282" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#2A3630">Pata &amp; Prosa Studio</text>
  <text x="64" y="306" font-family="sans-serif" font-size="12.5" fill="#5C6B64">Unidade Demonstrativa • Vila Jardim</text>
  <text x="64" y="328" font-family="sans-serif" font-size="12.5" fill="#4A6B5D" font-weight="700">✓ Vaga de embarque rápido na porta</text>
  <text x="64" y="348" font-family="sans-serif" font-size="11.5" fill="#8C5243">Endereço ilustrativo configurável</text>
</svg>
